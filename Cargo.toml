[package]
name = "en_get"
version = "0.1.0"
edition = "2021"
description = "One-click setup of Pi, R and Typst config files for students"

[dependencies]
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dirs = "6"
include_dir = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
