name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows: what students run. Ubuntu: runs the remote-script tests
    # (unix only) under dash, the /bin/sh of most Linux servers.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # publish releases on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: typst-community/setup-typst@v3
      - run: cargo build --release

      - name: Install Typst template and VS Code files into the runner's APPDATA
        shell: pwsh
        run: |
          ./target/release/en_get.exe --only typst --only vscode --no-pause
          if ($LASTEXITCODE) { throw "en_get failed with exit code $LASTEXITCODE" }
          foreach ($f in 'typst/packages/local/modern-cug-report/0.1.3/typst.toml',
                         'Code/User/settings.json', 'Code/User/keybindings.json',
                         'Code/User/snippets/typst.json') {
            if (!(Test-Path (Join-Path $env:APPDATA $f))) { throw "missing %APPDATA%/$f" }
          }
          ./target/release/en_get.exe --dry-run --only remote --no-pause
          if ($LASTEXITCODE) { throw "remote dry run failed" }

      - name: Compile Typst with the globally installed template
        run: typst compile tests/test.typ tests/test.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: en_get-windows-x64
          path: target/release/en_get.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" target/release/en_get.exe \
            --title "en_get ${{ github.ref_name }}" --notes-file .github/release-notes.md

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
